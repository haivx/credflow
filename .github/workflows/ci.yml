# CI: mỗi PR và mỗi push lên main chạy đúng các lệnh make như máy dev.
# Integration test dùng docker compose (có sẵn trên runner ubuntu), không dùng `services:` của Actions,
# để CI và máy dev đi cùng một đường. Không cần .env: test-int tự đặt env (apps/api/test/test-env.ts).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Đẩy commit mới lên cùng nhánh thì huỷ run cũ (đỡ tốn phút Actions).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Guardrail A8: cảnh báo PR chạm vùng kiến trúc. Chạm vùng không làm job fail.
  architecture-zones:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: bash tools/lint/architecture-zones.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # Không đặt `version`: action đọc `packageManager` trong package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: make build-packages
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make test-int

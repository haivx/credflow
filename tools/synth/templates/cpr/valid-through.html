<!doctype html>
<meta charset="utf-8" />
<!-- Thẻ dọc nhỏ, ngày MM/DD/YYYY, hạn chỉ có tháng/năm "Valid through". Dữ liệu hư cấu. -->
<style>
  body {
    margin: 0;
    padding: 40px;
    font-family: "Trebuchet MS", Arial, sans-serif;
    background: #fff;
  }
  #card {
    position: relative;
    width: 360px;
    height: 560px;
    border: 2px solid #5b3e96;
    border-radius: 12px;
    padding: 26px 24px;
    box-sizing: border-box;
    background: #fff;
  }
  .issuer {
    font-size: 18px;
    font-weight: 700;
    color: #5b3e96;
    text-align: center;
    border-bottom: 2px solid #5b3e96;
    padding-bottom: 10px;
  }
  .course {
    text-align: center;
    font-size: 16px;
    margin: 18px 0 26px;
  }
  .row {
    margin-bottom: 16px;
  }
  .k {
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .v {
    font-size: 19px;
  }
  .through {
    margin-top: 26px;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: #5b3e96;
  }
  .wm {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    font-weight: 700;
    color: rgba(200, 30, 30, 0.17);
    transform: rotate(-55deg);
    pointer-events: none;
  }
</style>
<div id="card">
  <div class="issuer">{{issuerName}}</div>
  <div class="course">{{courseType}}</div>
  <div class="row">
    <div class="k">Name</div>
    <div class="v">{{holderName}}</div>
  </div>
  <div class="row">
    <div class="k">Completed</div>
    <div class="v">{{completionText}}</div>
  </div>
  <div class="row">
    <div class="k">ID</div>
    <div class="v">{{cardNumber}}</div>
  </div>
  <div class="through">Valid through {{expiryText}}</div>
  <div class="wm">SAMPLE</div>
</div>

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: credflow
      POSTGRES_PASSWORD: credflow
      POSTGRES_DB: credflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  # Postgres riêng cho integration test (make test-int): dữ liệu trên tmpfs, bật lại là trống,
  # không bao giờ đụng dữ liệu dev. Healthcheck để `docker compose up --wait` chờ nhận kết nối.
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: credflow
      POSTGRES_PASSWORD: credflow
      POSTGRES_DB: credflow_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credflow -d credflow_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  # BullMQ cần noeviction: Redis tự xoá key khi đầy là mất job.
  # Không bật AOF vì Postgres là nguồn sự thật (ADR 0001).
  redis:
    image: redis:7
    command: redis-server --maxmemory-policy noeviction --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
